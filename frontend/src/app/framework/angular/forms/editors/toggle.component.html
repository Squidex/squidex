@let checked = isChecked();
<div
    class="toggle-container"
    [attr.data-state]="checked ? 'checked' : checked === false ? 'unchecked' : 'indeterminate'"
    [class.checked]="checked === true"
    [class.disabled]="disabled()"
    [class.unchecked]="checked === false"
    (click)="changeState()">
    <div class="toggle-button"></div>
    <i class="icon-close"></i> <i class="icon-checkmark"></i>
</div>
