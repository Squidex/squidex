<span class="color-container" #input>
    @if (mode() === "Input") {
        <input
            class="form-control"
            (blur)="blur()"
            (click)="picker.click()"
            (focus)="picker.click()"
            [ngModel]="value()"
            (ngModelChange)="updateValue($event)"
            [placeholder]="placeholder()"
            [style.background]="value()"
            [style.color]="valueForeground()"
            type="text" />
    } @else {
        <div class="circle" (click)="picker.click()" (focus)="picker.click()" [style.background]="value()"></div>
    }

    <input class="color-picker" #picker [ngModel]="valueParsed()" (ngModelChange)="updateValue($event)" type="color" />
</span>
