<span class="color-container" #input>
    @if (mode() === "Input") {
        <input
            class="form-control"
            (blur)="blur()"
            (click)="picker.click()"
            (focus)="picker.click()"
            (input)="updateValue($any($event.target).value)"
            [placeholder]="placeholder()"
            [style.background]="value()"
            [style.color]="valueForeground()"
            type="text"
            [value]="value() ?? ''" />
    } @else {
        <div class="circle" (click)="picker.click()" (focus)="picker.click()" [style.background]="value()"></div>
    }

    <input class="color-picker" #picker (input)="updateValue($any($event.target).value)" type="color" [value]="valueParsed()" />
</span>
