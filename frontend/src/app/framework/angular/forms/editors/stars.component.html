@let maxStars = maximumStars();
<div class="stars-container">
    @if (maxStars > 0 && maxStars <= 15) {
        <span class="stars" [class.disabled]="isDisabled()" (mouseleave)="stopPreview()">
            @for (star of starsArray(); track star) {
                <span class="star" [class.selected]="star <= valuePreview()" (click)="setValue(star)" (mouseenter)="setPreview(star)"></span>
            }
        </span>
        <button class="btn btn-text-secondary" [class.hidden]="!value()" (click)="reset()" type="button">
            {{ "common.clear" | sqxTranslate }}
        </button>
    } @else {
        <div class="many-stars">{{ "common.stars.max" | sqxTranslate }}</div>
    }
</div>
