<div class="row mb-1">
    <div class="col">
        <sqx-language-selector [language]="language()" (languageChange)="setLanguage($event)" [languages]="languages()" showAlways size="sm" />
    </div>

    <div class="col-auto">
        <button class="btn btn-sm btn-secondary" attr.aria-label="{{ 'common.clear' | sqxTranslate }}" (click)="unset()" [disabled]="valueIsEmpty() || disabled()" type="button">
            <i class="icon-close"></i>
        </button>
    </div>
</div>

@switch (type()) {
    @case ("text") {
        <input
            class="form-control"
            [attr.id]="id()"
            [attr.name]="name()"
            [attr.type]="type()"
            (blur)="markTouched()"
            [disabled]="disabled()"
            (input)="setValue($any($event.target).value)"
            [value]="valueCurrent() ?? ''" />
    }

    @case ("number") {
        <input
            class="form-control"
            [attr.id]="id()"
            [attr.name]="name()"
            [attr.type]="type()"
            (blur)="markTouched()"
            [disabled]="disabled()"
            (input)="setValue($any($event.target).value)"
            [value]="valueCurrent() ?? ''" />
    }

    @case ("tags") {
        <sqx-tag-editor [disabled]="disabled()" [id]="id()" (editorBlur)="markTouched()" [value]="valueCurrent()" (valueChange)="setValue($event)" />
    }

    @case ("datetime") {
        <sqx-date-time-editor [disabled]="disabled()" [id]="id()" (editorBlur)="markTouched()" mode="DateTime" [value]="valueCurrent()" (valueChange)="setValue($event)" />
    }

    @case ("date") {
        <sqx-date-time-editor [disabled]="disabled()" [id]="id()" (editorBlur)="markTouched()" mode="Date" [value]="valueCurrent()" (valueChange)="setValue($event)" />
    }

    @case ("boolean") {
        <div class="form-check">
            <sqx-checkbox [disabled]="disabled()" [inputId]="id()" (touchedChange)="markTouched()" [value]="valueCurrent()" (valueChange)="setValue($event)" />
            <label class="form-check-label" [attr.for]="id()"></label>
        </div>
    }
}
