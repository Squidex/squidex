<div #container (sqxResized)="updateContainerWidth($event.width)">
    @for (option of tagValues(); track option.id) {
        <div class="form-check" [class.form-check-block]="!isSingleline()" [class.form-check-inline]="isSingleline()">
            <input
                class="form-check-input"
                id="{{ controlId }}_{{ option }}"
                (blur)="markTouched()"
                (change)="select(option)"
                [checked]="option.value === value()"
                [disabled]="disabled()"
                [name]="controlId"
                type="radio" />
            <label class="form-check-label" for="{{ controlId }}_{{ option }}">{{ option.name }}</label>
        </div>
    }
</div>
