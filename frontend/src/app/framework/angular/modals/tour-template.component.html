@if (currentStep(); as step) {
    <div
        class="tour-step"
        animate.enter="fade-in"
        animate.leave="fade-out"
        [class.d-none]="!isVisible()"
        offset="4"
        [position]="step.position || 'bottom-start'"
        spaceX="0"
        spaceY="0"
        [sqxAnchoredTo]="currentElement()"
        *sqxModal="currentElement(); closeAuto: false">
        <div class="tour-progress" [style.width]="progress()"></div>

        <div class="tour-body">
            <div class="row g-2">
                <div class="col-auto">
                    <div class="squid d-flex align-items-center justify-content-center bordered"><img src="./images/squid.svg" /></div>
                </div>

                <div class="col">
                    <h5 [sqxMarkdown]="step.title | sqxTranslate"></h5>

                    <div inline="false" [sqxMarkdown]="step.content | sqxTranslate"></div>
                </div>

                <div class="col-auto"><button class="btn btn-sm btn-close" (click)="tourService.end()" type="button"></button></div>
            </div>
        </div>

        @if (hasNext() || hasPrev || hasFinish() || step.hideAll || step.hideThis) {
            <div class="tour-footer">
                <div class="d-flex justify-content-between">
                    <div class="d-flex pe-4">
                        @if (hasPrev) {
                            <button class="btn btn-outline-secondary btn-sm me-2" (click)="tourService.prev()" type="button">
                                {{ "common.prev" | sqxTranslate }}
                            </button>
                        }

                        @if (step.hideAll; as hideAll) {
                            <button class="btn btn-outline-danger btn-sm" (click)="hideAll()" type="button">
                                {{ "tour.tooltipStop" | sqxTranslate }}
                            </button>
                        }
                    </div>

                    <div class="d-flex ps-4">
                        @if (hasNext()) {
                            <button class="btn btn-outline-secondary btn-sm" (click)="tourService.next()" type="button">
                                {{ "common.next" | sqxTranslate }}
                            </button>
                        }

                        @if (hasFinish()) {
                            <button class="btn btn-outline-success btn-sm" (click)="tourService.end()" type="button">
                                {{ "common.finish" | sqxTranslate }}
                            </button>
                        }

                        @if (step.hideThis; as hideThis) {
                            <button class="btn btn-outline-success btn-sm" (click)="hideThis()" type="button">
                                {{ "tour.tooltipConfirm" | sqxTranslate }}
                            </button>
                        }
                    </div>
                </div>
            </div>
        }
    </div>
}
