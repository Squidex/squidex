@let isEditable = this.isEditable();
@for (branch of branches(); track $index; let i = $index) {
    <div class="form-group row gx-2">
        <div class="col">
            <sqx-control-errors [for]="branch.condition" />
            <input class="form-control" [formField]="branch.condition" placeholder="{{ 'common.condition' | sqxTranslate }}" />
        </div>

        <div class="col-auto">
            <button
                class="btn btn-text-danger"
                attr.aria-label="{{ 'common.delete' | sqxTranslate }}"
                (click)="remove(i)"
                [disabled]="!isEditable"
                type="button">
                <i class="icon-bin3"></i>
            </button>
        </div>
    </div>
}

@if (isEditable) {
    <div class="form-group row gx-2">
        <div class="col">
            <div class="form-control preview">{{ "common.condition" | sqxTranslate }}</div>
        </div>

        <div class="col-auto">
            <button class="btn btn-success" attr.aria-label="{{ 'common.add' | sqxTranslate }}" (click)="add()" type="button">
                <i class="icon-add"></i>
            </button>
        </div>
    </div>
}
