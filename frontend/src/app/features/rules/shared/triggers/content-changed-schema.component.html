@let field = this.field();
<div class="row gx-2">
    <div class="col col-3">
        <sqx-control-errors [for]="field.schemaId" />
        <select class="form-select schemas-control" [formField]="field.schemaId">
            @for (schema of schemas(); track schema.id) {
                <option [ngValue]="schema.id">{{ schema.displayName }}</option>
            }
        </select>
    </div>

    <div class="col-auto">
        <div class="label text-muted">{{ "rules.when" | sqxTranslate }}</div>
    </div>

    <div class="col">
        <sqx-control-errors [for]="field.condition" />
        <sqx-code-editor [completion]="completions.value()" [formField]="field.condition" singleLine="true" />
    </div>

    <div class="col-auto">
        <button
            class="btn btn-text-danger"
            attr.aria-label="{{ 'common.remove' | sqxTranslate }}"
            confirmRememberKey="deleteContentChangedSchema"
            confirmText="i18n:rules.deleteContentChangedSchemaText"
            confirmTitle="i18n:rules.deleteContentChangedSchemaTitle"
            [disabled]="field().disabled()"
            (sqxConfirmClick)="remove.emit()"
            type="button">
            <i class="icon-bin3"></i>
        </button>
    </div>
</div>
