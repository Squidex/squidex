@let userDto = user();
<tr queryParamsHandling="preserve" [routerLink]="userDto.id" routerLinkActive="active">
    <td class="cell-user"><img class="user-picture" [src]="userDto | sqxUserDtoPicture" title="{{ userDto.displayName }}" /></td>

    <td class="cell-auto">
        <span class="user-name table-cell">{{ userDto.displayName }}</span>
    </td>

    <td class="cell-auto">
        <span class="user-email table-cell">{{ userDto.email }}</span>
    </td>

    <td class="cell-actions-lg">
        @if (userDto.canLock) {
            <button
                class="btn btn-text-secondary"
                attr.aria-label="{{ 'users.lockTooltip' | sqxTranslate }}"
                (click)="lock()"
                sqxStopClick
                title="i18n:users.lockTooltip"
                type="button">
                <i class="icon icon-unlocked"></i>
            </button>
        }

        @if (userDto.canUnlock) {
            <button
                class="btn btn-text-secondary"
                attr.aria-label="{{ 'users.unlockTooltip' | sqxTranslate }}"
                (click)="unlock()"
                sqxStopClick
                title="i18n:users.unlockTooltip"
                type="button">
                <i class="icon icon-lock"></i>
            </button>
        }
        <button
            class="btn btn-text-danger"
            attr.aria-label="{{ 'common.delete' | sqxTranslate }}"
            confirmRememberKey="deleteUser"
            confirmText="i18n:users.deleteConfirmText"
            confirmTitle="i18n:users.deleteConfirmTitle"
            [disabled]="!userDto.canDelete"
            (sqxConfirmClick)="delete()"
            sqxStopClick
            type="button">
            <i class="icon-bin3"></i>
        </button>
    </td>
</tr>

<tr class="spacer"></tr>
