<form (ngSubmit)="save()">
    <input name="foilautofill" style="display: none" type="password" />
    <sqx-layout layout="right" overflow="true" padding="true" white="true" width="30">
        <ng-container title>
            @if (usersState.selectedUser()) {
                <sqx-title message="i18n:users.editPageTitle" />
                <h3>{{ "users.editTitle" | sqxTranslate }}</h3>
            } @else {
                <sqx-title message="i18n:users.createPageTitle" />
                <h3>{{ "users.createTitle" | sqxTranslate }}</h3>
            }
        </ng-container>
        <ng-container menu>
            @if (usersState.selectedUser()) {
                @if (isEditable()) {
                    <button class="btn btn-primary" shortcut="CTRL + SHIFT + S" type="submit">{{ "common.save" | sqxTranslate }}</button>
                }
            } @else {
                <button class="btn btn-primary" shortcut="CTRL + SHIFT + S" type="submit">{{ "common.save" | sqxTranslate }}</button>
            }
        </ng-container>
        <ng-container>
            <sqx-form-error [error]="userForm.error()" />
            <sqx-form-row [for]="userForm.form.email" label="common.email" required vertical>
                <input class="form-control" id="email" autocomplete="off" [formField]="userForm.form.email" type="email" />
            </sqx-form-row>

            <sqx-form-row [for]="userForm.form.displayName" label="common.displayName" required vertical>
                <input class="form-control" id="displayName" autocomplete="off" [formField]="userForm.form.displayName" spellcheck="false" />
            </sqx-form-row>

            <div class="form-section">
                <sqx-form-row [for]="userForm.form.password" label="common.password" vertical>
                    <input class="form-control" id="password" autocomplete="off" [formField]="userForm.form.password" type="password" />
                </sqx-form-row>

                <sqx-form-row [for]="userForm.form.passwordConfirm" label="common.passwordConfirm" vertical>
                    <input class="form-control" id="passwordConfirm" autocomplete="off" [formField]="userForm.form.passwordConfirm" type="password" />
                </sqx-form-row>
            </div>

            <div class="form-section">
                <sqx-form-row [for]="userForm.form.permissions" label="common.permissions" vertical>
                    <textarea
                        class="form-control"
                        id="permissions"
                        autocomplete="off"
                        [formField]="userForm.form.permissions"
                        placeholder="{{ 'common.separateByLine' | sqxTranslate }}"
                        spellcheck="false"></textarea>
                </sqx-form-row>
            </div>
        </ng-container>
    </sqx-layout>
</form>
