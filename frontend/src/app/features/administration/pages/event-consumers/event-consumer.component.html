@let consumer = eventConsumer();
<tr [class.faulted]="consumer.error && consumer.error.length > 0">
    <td class="cell-auto">
        <span class="truncate">
            <i class="faulted-icon icon icon-bug" [class.hidden]="!consumer.error || consumer.error.length === 0" (click)="failure.emit()"></i>
            {{ consumer.name }}
        </span>
    </td>

    <td class="cell-auto-right">
        <span>{{ consumer.count }}</span>
    </td>

    <td class="cell-auto-right">
        <span>{{ consumer.position }}</span>
    </td>

    <td class="cell-actions-lg">
        @if (consumer.canReset) {
            <button
                class="btn btn-text-secondary"
                attr.aria-label="{{ 'eventConsumers.resetTooltip' | sqxTranslate }}"
                (click)="reset()"
                title="i18n:eventConsumers.resetTooltip"
                type="button">
                <i class="icon icon-reset"></i>
            </button>
        }

        @if (consumer.canStart) {
            <button
                class="btn btn-text-secondary"
                attr.aria-label="{{ 'eventConsumers.startTooltip' | sqxTranslate }}"
                (click)="start()"
                title="i18n:eventConsumers.startTooltip"
                type="button">
                <i class="icon icon-play"></i>
            </button>
        }

        @if (consumer.canStop) {
            <button
                class="btn btn-text-secondary"
                attr.aria-label="{{ 'eventConsumers.stopTooltip' | sqxTranslate }}"
                (click)="stop()"
                title="i18n:eventConsumers.stopTooltip"
                type="button">
                <i class="icon icon-pause"></i>
            </button>
        }
    </td>
</tr>

<tr class="spacer"></tr>
