<sqx-layout layout="right" overflow="true" padding="true" titleText="i18n:common.filters" white="true" width="20">
    <h3>{{ "common.tags" | sqxTranslate }}</h3>
    <sqx-asset-tags
        [canRename]="assetsState.canRenameTag()"
        [tags]="assetsState.tags()"
        (tagsReset)="resetTags()"
        [tagsSelected]="assetsState.tagsSelected()"
        (toggle)="toggleTag($event)" />
    <hr />
    <sqx-shared-queries [queries]="assetsQueries" [queryUsed]="assetsState.query()" (search)="search($event)" [types]="'common.assets' | sqxTranslate" />
</sqx-layout>
