<form (ngSubmit)="renameAssetTag()">
    <sqx-modal-dialog (dialogClose)="emitClose()">
        <ng-container title> {{ "common.renameTag" | sqxTranslate }}</ng-container>
        <ng-container content>
            <sqx-form-error [error]="editForm.error()" />
            <sqx-form-row [for]="editForm.form.tagName" label="common.name" required vertical>
                <input class="form-control" id="tagName" autocomplete="off" [formField]="editForm.form.tagName" sqxFocusOnInit />
            </sqx-form-row>
        </ng-container>
        <ng-container footer>
            <button class="btn btn-text-secondary" (click)="emitClose()" type="button">{{ "common.cancel" | sqxTranslate }}</button>
            <button class="btn btn-success" type="submit">{{ "common.rename" | sqxTranslate }}</button>
        </ng-container>
    </sqx-modal-dialog>
</form>
