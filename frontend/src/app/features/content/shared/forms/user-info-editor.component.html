<div class="form" (focusout)="touched.set(true)">
    <sqx-form-row #apiKeyRow [for]="userInfoForm.apiKey" label="common.apiKey" [prefix]="formId()" required>
        <div class="form-group">
            <input class="form-control key" [id]="apiKeyRow.fieldName()" autocomplete="off" [formField]="userInfoForm.apiKey" />
            <button class="btn btn-text-secondary btn-sm key-generate" (click)="generateApiKey()" type="button">
                {{ "common.generate" | sqxTranslate }}
            </button>
        </div>
    </sqx-form-row>

    <sqx-form-row #roleRow [for]="userInfoForm.role" label="common.role" [prefix]="formId()" required>
        <select class="form-select" [id]="roleRow.fieldName()" autocomplete="off" [formField]="userInfoForm.role">
            @for (role of rolesState.roles(); track role.name) {
                <option [ngValue]="role.name">{{ role.name }}</option>
            }
        </select>
    </sqx-form-row>

    <sqx-form-row for="none">
        <sqx-form-hint> <span inline="false" [sqxMarkdown]="'contents.userInfo.instructions' | sqxTranslate"></span> </sqx-form-hint>
        <sqx-code>
            <div ngPreserveWhitespaces>Authorization: ApiKey {{ rolesState.appName }}:{{ apiKey() }}</div>
        </sqx-code>
        <sqx-form-hint>
            {{ "common.or" | sqxTranslate }}
        </sqx-form-hint>
        <sqx-code>
            <div ngPreserveWhitespaces>ApiKey: {{ rolesState.appName }}:{{ apiKey() }}</div>
        </sqx-code>
    </sqx-form-row>
</div>
