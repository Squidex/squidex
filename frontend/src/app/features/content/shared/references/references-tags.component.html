<sqx-tag-editor
    allowDuplicates="false"
    allowOpen="true"
    (dropdownOpen)="onOpened()"
    [disabled]="isEditorDisabled()"
    [itemConverter]="converter()"
    [itemsSource]="converter().tags"
    [itemsSourceLoading]="contentsLoading()"
    [value]="selectedIds()"
    (valueChange)="updateValue($event)"
    placeholder="{{ 'common.tagAddReference' | sqxTranslate }}" />
