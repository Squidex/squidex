<div>
    <sqx-form-row [for]="form().minValue" label="schemas.fieldTypes.dateTime.rangeMin" [prefix]="field().fieldId">
        <sqx-date-time-editor [formField]="form().minValue" mode="DateTime" />
    </sqx-form-row>

    <sqx-form-row [for]="form().maxValue" label="schemas.fieldTypes.dateTime.rangeMax" [prefix]="field().fieldId">
        <sqx-date-time-editor [formField]="form().maxValue" mode="DateTime" />
    </sqx-form-row>

    @if (showDefaultValues()) {
        <sqx-form-row [for]="form().calculatedDefaultValue" label="schemas.fieldTypes.dateTime.defaultMode" [prefix]="field().fieldId">
            <select class="form-select" [formField]="form().calculatedDefaultValue">
                <option></option>

                @for (value of calculatedDefaultValues; track value) {
                    <option [ngValue]="value">{{ value }}</option>
                }
            </select>
        </sqx-form-row>

        @if (showDefaultValue()) {
            <sqx-form-row #defaultValueRow [for]="form().defaultValue" label="schemas.field.defaultValue" [prefix]="field().fieldId">
                <sqx-date-time-editor [id]="defaultValueRow.fieldName()" [formField]="form().defaultValue" mode="DateTime" />
            </sqx-form-row>
        }

        @if (isLocalizable()) {
            <sqx-form-row
                #defaultValueRows
                [for]="form().defaultValues"
                hint="schemas.field.defaultValuesHint"
                label="schemas.field.defaultValues"
                [prefix]="field().fieldId">
                <sqx-localized-input [id]="defaultValueRows.fieldName()" [formField]="form().defaultValues" [languages]="languages()" type="datetime" />
            </sqx-form-row>
        }
    }
</div>
