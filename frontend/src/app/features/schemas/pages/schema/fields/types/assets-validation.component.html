<div>
    <sqx-form-row [for]="form().minItems" hideError label="schemas.fieldTypes.assets.count" [prefix]="field().fieldId" showUnit="true">
        <div class="row g-0">
            <div class="col">
                <input class="form-control" [formField]="form().minItems" placeholder="{{ 'schemas.fieldTypes.assets.countMin' | sqxTranslate }}" type="number" />
            </div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col">
                <input class="form-control" [formField]="form().maxItems" placeholder="{{ 'schemas.fieldTypes.assets.countMax' | sqxTranslate }}" type="number" />
            </div>
        </div>
    </sqx-form-row>

    <sqx-form-row [for]="form().minSize" hideError label="schemas.fieldTypes.assets.size" [prefix]="field().fieldId" unit="common.bytes">
        <div class="row g-0">
            <div class="col">
                <input class="form-control" [formField]="form().minSize" placeholder="{{ 'schemas.fieldTypes.assets.sizeMin' | sqxTranslate }}" type="number" />
            </div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col">
                <input class="form-control" [formField]="form().maxSize" placeholder="{{ 'schemas.fieldTypes.assets.sizeMax' | sqxTranslate }}" type="number" />
            </div>
        </div>
    </sqx-form-row>

    <hr />

    <sqx-form-row [for]="form().expectedType" label="schemas.fieldTypes.assets.expectedType" [prefix]="field().fieldId" showUnit="true">
        <select class="form-select" [formField]="form().expectedType">
            <option></option>
            <option value="Image">Image</option>
            <option value="Audio">Audio</option>
            <option value="Video">Video</option>
            <option value="Unknown">Unknown</option>
        </select>
    </sqx-form-row>

    <sqx-form-row [for]="form().minWidth" hideError label="common.width" [prefix]="field().fieldId" unit="px">
        <div class="row g-0">
            <div class="col"><input class="form-control" [formField]="form().minWidth" type="number" /></div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col"><input class="form-control" [formField]="form().maxWidth" type="number" /></div>
        </div>
    </sqx-form-row>

    <sqx-form-row [for]="form().minHeight" hideError label="common.height" [prefix]="field().fieldId" unit="px">
        <div class="row g-0">
            <div class="col"><input class="form-control" [formField]="form().minHeight" type="number" /></div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col"><input class="form-control" [formField]="form().maxHeight" type="number" /></div>
        </div>
    </sqx-form-row>

    <sqx-form-row for="aspectRatio" hideError label="common.aspectRatio" [prefix]="field().fieldId" unit="px">
        <div class="row g-0">
            <div class="col"><input class="form-control" [formField]="form().aspectWidth" type="number" /></div>

            <div class="col-auto"><label class="col-form-label minmax">:</label></div>

            <div class="col"><input class="form-control" [formField]="form().aspectHeight" type="number" /></div>
        </div>
    </sqx-form-row>

    <hr />

    <sqx-form-row #allowDuplicatesRow check [for]="form().allowDuplicates" hideError label="schemas.fieldTypes.assets.allowDuplicates" [prefix]="field().fieldId">
        <input class="form-check-input" [id]="allowDuplicatesRow.fieldName()" [formField]="form().allowDuplicates" type="checkbox" />
    </sqx-form-row>

    <sqx-form-row #allowedExtensionsRow [for]="form().allowedExtensions" hideError label="schemas.fieldTypes.assets.fileExtensions" [prefix]="field().fieldId">
        <sqx-tag-editor [id]="allowedExtensionsRow.fieldName()" [formField]="form().allowedExtensions" />
    </sqx-form-row>

    <sqx-form-row #defaultValueRow [for]="form().defaultValue" hideError label="schemas.field.defaultValue" [prefix]="field().fieldId">
        <sqx-tag-editor [id]="defaultValueRow.fieldName()" [formField]="form().defaultValue" />
    </sqx-form-row>

    @if (isLocalizable()) {
        <sqx-form-row
            #defaultValuesRow
            [for]="form().defaultValues"
            hideError
            hint="schemas.field.defaultValuesHint"
            label="schemas.field.defaultValues"
            [prefix]="field().fieldId">
            <sqx-localized-input [id]="defaultValuesRow.fieldName()" [formField]="form().defaultValues" [languages]="languages()" type="tags" />
        </sqx-form-row>
    }
</div>
