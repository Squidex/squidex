<div>
    <sqx-form-row
        #roleRow
        [for]="form().defaultRole"
        hint="schemas.fieldTypes.userInfo.defaultRoleHint"
        label="schemas.fieldTypes.userInfo.defaultRole"
        [prefix]="field().fieldId">
        <select class="form-select" [id]="roleRow.fieldName()" autocomplete="off" [formField]="form().defaultRole">
            @for (role of rolesState.roles(); track role.name) {
                <option [value]="role.name">{{ role.name }}</option>
            }
        </select>
    </sqx-form-row>
</div>
