<div>
    <sqx-form-row [for]="form().minItems" hideError label="schemas.fieldTypes.references.count" [prefix]="field().fieldId">
        <div class="row g-0">
            <div class="col">
                <input
                    class="form-control"
                    [formField]="form().minItems"
                    placeholder="{{ 'schemas.fieldTypes.references.countMin' | sqxTranslate }}"
                    type="number" />
            </div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col">
                <input
                    class="form-control"
                    [formField]="form().maxItems"
                    placeholder="{{ 'schemas.fieldTypes.references.countMax' | sqxTranslate }}"
                    type="number" />
            </div>
        </div>
    </sqx-form-row>

    <sqx-form-row #schemaIdsRow [for]="form().schemaIds" label="common.schemas" [prefix]="field().fieldId">
        <sqx-tag-editor
            [id]="schemaIdsRow.fieldName()"
            [formField]="form().schemaIds"
            [itemConverter]="schemasSource.converter()"
            [itemsSource]="schemasSource.converter().suggestions"
            placeholder="{{ 'common.tagAddSchema' | sqxTranslate }}" />
    </sqx-form-row>

    <sqx-form-row #uniqueFieldsRow [for]="form().uniqueFields" label="schemas.fieldTypes.array.uniqueFields" [prefix]="field().fieldId">
        <sqx-tag-editor [id]="uniqueFieldsRow.fieldName()" [formField]="form().uniqueFields" />
    </sqx-form-row>
</div>
