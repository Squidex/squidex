<div>
    <sqx-form-row [for]="form().calculatedDefaultValue" label="schemas.field.defaultValue">
        <select class="form-select" [formField]="form().calculatedDefaultValue">
            @for (value of calculatedDefaultValues; track value) {
                <option [value]="value">{{ value }}</option>
            }
        </select>
    </sqx-form-row>
</div>
