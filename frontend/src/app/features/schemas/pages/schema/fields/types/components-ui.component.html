<div>
    <sqx-form-row [for]="form().calculatedDefaultValue" label="schemas.field.defaultValue" [prefix]="field().fieldId">
        <select class="form-select" [formField]="form().calculatedDefaultValue">
            @for (value of calculatedDefaultValues; track value) {
                <option [ngValue]="value">{{ value }}</option>
            }
        </select>
    </sqx-form-row>
</div>
