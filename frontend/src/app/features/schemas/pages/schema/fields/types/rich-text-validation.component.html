<div>
    <sqx-form-row [for]="form().minLength" hideError label="schemas.fieldTypes.string.length" [prefix]="field().fieldId">
        <div class="row g-0">
            <div class="col">
                <input
                    class="form-control"
                    [formField]="form().minLength"
                    placeholder="{{ 'schemas.fieldTypes.string.lengthMin' | sqxTranslate }}"
                    type="number" />
            </div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col">
                <input
                    class="form-control"
                    [formField]="form().maxLength"
                    placeholder="{{ 'schemas.fieldTypes.string.lengthMax' | sqxTranslate }}"
                    type="number" />
            </div>
        </div>
    </sqx-form-row>

    <sqx-form-row [for]="form().minCharacters" hideError label="schemas.fieldTypes.string.characters" [prefix]="field().fieldId">
        <div class="row g-0">
            <div class="col">
                <input
                    class="form-control"
                    [formField]="form().minCharacters"
                    placeholder="{{ 'schemas.fieldTypes.string.charactersMin' | sqxTranslate }}"
                    type="number" />
            </div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col">
                <input
                    class="form-control"
                    [formField]="form().maxCharacters"
                    placeholder="{{ 'schemas.fieldTypes.string.charactersMax' | sqxTranslate }}"
                    type="number" />
            </div>
        </div>
    </sqx-form-row>

    <sqx-form-row [for]="form().minWords" hideError label="schemas.fieldTypes.string.words" [prefix]="field().fieldId">
        <div class="row g-0">
            <div class="col">
                <input class="form-control" [formField]="form().minWords" placeholder="{{ 'schemas.fieldTypes.string.wordsMin' | sqxTranslate }}" type="number" />
            </div>

            <div class="col-auto"><label class="col-form-label minmax">-</label></div>

            <div class="col">
                <input class="form-control" [formField]="form().maxWords" placeholder="{{ 'schemas.fieldTypes.string.wordsMax' | sqxTranslate }}" type="number" />
            </div>
        </div>
    </sqx-form-row>
</div>
