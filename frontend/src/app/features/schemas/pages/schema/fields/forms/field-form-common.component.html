<div>
    <sqx-form-row #nameRow for="name" hint="schemas.field.nameHint" label="common.name" [prefix]="field().fieldId">
        <input class="form-control" [id]="nameRow.fieldName()" readonly [value]="field().name" />
    </sqx-form-row>

    <sqx-form-row #labelRow [for]="fieldForm().label" hint="schemas.field.labelHint" label="common.label" [prefix]="field().fieldId">
        <input class="form-control" [id]="labelRow.fieldName()" [formField]="fieldForm().label" />
    </sqx-form-row>

    <sqx-form-row #hintsRow [for]="fieldForm().hints" hint="schemas.field.hintsHint" label="common.hints" [prefix]="field().fieldId">
        <input class="form-control" [id]="hintsRow.fieldName()" [formField]="fieldForm().hints" />
    </sqx-form-row>

    @if (field().properties.isContentField) {
        <sqx-form-row #tagsRow [for]="fieldForm().tags" hint="schemas.field.tagsHint" label="common.tags" [prefix]="field().fieldId">
            <sqx-tag-editor [id]="tagsRow.fieldName()" [formField]="fieldForm().tags" />
        </sqx-form-row>

        <sqx-form-row #searchModeRow [for]="fieldForm().searchMode" hint="schemas.field.searchModeHint" label="schemas.field.searchMode" [prefix]="field().fieldId">
            <select class="form-select" [id]="searchModeRow.fieldName()" [formField]="fieldForm().searchMode">
                <option ngValue="Default">{{ "schemas.field.searchModeDefault" | sqxTranslate }}</option>
                <option ngValue="Title">{{ "schemas.field.searchModeTitle" | sqxTranslate }}</option>
                <option ngValue="Exclude">{{ "schemas.field.searchModeExclude" | sqxTranslate }}</option>
            </select>
        </sqx-form-row>

        <sqx-form-row #searchPathsRow [for]="fieldForm().searchPaths" hint="schemas.field.searchPathsHint" label="schemas.field.searchPaths" [prefix]="field().fieldId">
            <sqx-tag-editor [id]="searchPathsRow.fieldName()" [formField]="fieldForm().searchPaths" />
        </sqx-form-row>
    }
</div>
