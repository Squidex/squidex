<div>
    <sqx-form-row [for]="form().editor" label="schemas.field.editor" [prefix]="field().fieldId">
        @for (editor of editors; track editor) {
            <label class="btn btn-radio" [class.active]="form().editor().value() === editor">
                <input class="radio-input" [formField]="form().editor" type="radio" [value]="editor" />
                <i class="icon-control-{{ editor }}"></i> <span class="radio-label">{{ editor }}</span>
            </label>
        }
    </sqx-form-row>

    @if (field().properties.isContentField) {
        <sqx-form-row
            #isContentFieldRow
            check
            [for]="form().resolveReference"
            hint="schemas.fieldTypes.references.resolveHint"
            label="schemas.fieldTypes.references.resolve"
            [prefix]="field().fieldId">
            <input class="form-check-input" [id]="isContentFieldRow.fieldName()" [formField]="form().resolveReference" type="checkbox" />
        </sqx-form-row>
    }

    <sqx-form-row #queryRow [for]="form().query" hint="schemas.fieldTypes.references.queryHint" label="schemas.fieldTypes.references.query" [prefix]="field().fieldId">
        <input class="form-control" [id]="queryRow.fieldName()" [formField]="form().query" type="text" />
    </sqx-form-row>
</div>
