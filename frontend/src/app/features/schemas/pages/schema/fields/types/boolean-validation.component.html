<div>
    <sqx-form-row #defaultValueRow [for]="form().defaultValue" label="schemas.field.defaultValue" [prefix]="field().fieldId">
        <sqx-checkbox [formField]="form().defaultValue" [inputId]="defaultValueRow.fieldName()" />
    </sqx-form-row>

    @if (isLocalizable()) {
        <sqx-form-row #defaultValueRows [for]="form().defaultValues" hint="schemas.field.defaultValuesHint" label="schemas.field.defaultValues" [prefix]="field().fieldId">
            <sqx-localized-input [id]="defaultValueRows.fieldName()" [formField]="form().defaultValues" [languages]="languages()" type="boolean" />
        </sqx-form-row>
    }
</div>
