<sqx-modal-dialog showHeader="false">
    <ng-container tabs>
        <div class="squid d-flex align-items-center justify-content-center"><img src="./images/squid.svg" /></div>
    </ng-container>
    <ng-container content>
        <button class="header-right modal-close btn-inline-link" (click)="cancel()" type="button">{{ "tour.skip" | sqxTranslate }}</button>
        @if (step() === 0) {
            <div class="onboarding-step">
                <img class="header-left" animate.enter="fade-in" animate.leave="fade-out" src="./images/logo-white-small.png" />
                <div class="onboarding-enter-leave text-center" animate.enter="slide-left-in" animate.leave="slide-left-out">
                    <h1>
                        {{ "tour.welcome" | sqxTranslate }}<span class="header-focus">{{ "tour.welcomeProduct" | sqxTranslate }}</span>
                    </h1>

                    <div inline="false" [sqxMarkdown]="'tour.stepIntroText' | sqxTranslate"></div>

                    <div class="mt-4">
                        <button class="btn btn-success" (click)="next()" type="button">{{ "tour.stepIntroNext" | sqxTranslate }}</button>
                    </div>
                </div>
            </div>
        }

        @if (step() === 1) {
            <div>
                <img class="header-left" animate.enter="fade-in" animate.leave="fade-out" src="./images/logo-white-small.png" />
                <div class="onboarding-enter-leave" animate.enter="slide-left-in" animate.leave="slide-left-out">
                    <form (ngSubmit)="submitAnswers()">
                        <h2>{{ "tour.stepDataTitle" | sqxTranslate }}</h2>

                        <div [sqxMarkdown]="'tour.stepDataText' | sqxTranslate"></div>

                        <sqx-form-row class="mt-4" [for]="answersForm.companyRole" label="tour.stepDataCompanyRole" vertical="true">
                            <select class="form-select" id="companyRole" [formField]="answersForm.companyRole">
                                <option value="RoleEmployee">{{ "tour.roleEmployee" | sqxTranslate }}</option>
                                <option value="RoleBusinessOwner">{{ "tour.roleBusinessOwner" | sqxTranslate }}</option>
                                <option value="RoleProductManager">{{ "tour.roleProductManager" | sqxTranslate }}</option>
                                <option value="RoleContentCreator">{{ "tour.roleContentCreator" | sqxTranslate }}</option>
                                <option value="RoleSoftwareDeveloper">{{ "tour.roleSoftwareDeveloper" | sqxTranslate }}</option>
                                <option value="RoleBusinessAnalyst">{{ "tour.roleBusinessAnalyst" | sqxTranslate }}</option>
                            </select>
                        </sqx-form-row>

                        <sqx-form-row [for]="answersForm.companySize" label="tour.stepDataCompanySize" vertical="true">
                            <select class="form-select" id="companySize" [formField]="answersForm.companySize">
                                <option value="SizeSingle">{{ "tour.sizeSingle" | sqxTranslate }}</option>
                                <option value="SizeSmall">{{ "tour.sizeSmall" | sqxTranslate }}</option>
                                <option value="SizeMedium">{{ "tour.sizeMedium" | sqxTranslate }}</option>
                                <option value="SizeLarge">{{ "tour.sizeLarge" | sqxTranslate }}</option>
                                <option value="SizeVeryLarge">{{ "tour.sizeVeryLarge" | sqxTranslate }}</option>
                            </select>
                        </sqx-form-row>

                        <sqx-form-row [for]="answersForm.project" label="tour.stepDataProject" vertical="true">
                            <select class="form-select" id="project" [formField]="answersForm.project">
                                <option value="ProjectNewsMagazine">{{ "tour.projectNewsMagazine" | sqxTranslate }}</option>
                                <option value="ProjectPersonalBlog">{{ "tour.projectPersonalBlog" | sqxTranslate }}</option>
                                <option value="ProjectSmallBusiness">{{ "tour.projectSmallBusiness" | sqxTranslate }}</option>
                                <option value="ProjectCommerce">{{ "tour.projectCommerce" | sqxTranslate }}</option>
                                <option value="ProjectMobileApp">{{ "tour.projectMobileApp" | sqxTranslate }}</option>
                                <option value="ProjectBackend">{{ "tour.projectBackend" | sqxTranslate }}</option>
                                <option value="ProjectLearning">{{ "tour.projectLearning" | sqxTranslate }}</option>
                            </select>
                        </sqx-form-row>

                        <button class="btn btn-success" type="submit">{{ "tour.stepDataNext" | sqxTranslate }}</button>
                    </form>
                </div>
            </div>
        }

        @if (step() === 2) {
            <div class="onboarding-step">
                <img class="header-left" animate.enter="fade-in" animate.leave="fade-out" src="./images/logo-white-small.png" />
                <div class="onboarding-enter-leave text-center" animate.enter="slide-left-in" animate.leave="slide-left-out">
                    <h2>{{ "tour.stepTourTitle" | sqxTranslate }}</h2>

                    <div [sqxMarkdown]="'tour.stepTourText' | sqxTranslate"></div>

                    <div class="mt-4">
                        <button class="btn btn-success" (click)="start()" type="button">{{ "tour.startYes" | sqxTranslate }}</button>
                        <button class="btn btn-outline-secondary ms-2" (click)="cancel()" type="button">
                            {{ "tour.startNo" | sqxTranslate }}
                        </button>
                    </div>
                </div>
            </div>
        }
    </ng-container>
</sqx-modal-dialog>
