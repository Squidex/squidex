@let contributorValue = contributor();
<tr>
    <td class="cell-user">
        <img class="user-picture" [src]="contributorValue.contributorId | sqxUserPicture" title="{{ contributorValue.contributorName }}" />
    </td>

    <td class="cell-auto"><span class="user-name table-cell" [innerHTML]="contributorValue.contributorName | sqxHighlight: search()"></span></td>

    <td class="cell-time">
        <select class="form-select" [disabled]="!contributorValue.canUpdate" [ngModel]="contributorValue.role" (ngModelChange)="changeRole($event)">
            @for (role of roles(); track role) {
                <option [ngValue]="role.name">{{ role.name }}</option>
            }
        </select>
    </td>

    <td class="cell-actions">
        <button
            class="btn btn-text-danger"
            attr.aria-label="{{ 'common.delete' | sqxTranslate }}"
            confirmRememberKey="removeContributor"
            confirmText="i18n:contributors.deleteConfirmText"
            confirmTitle="i18n:contributors.deleteConfirmTitle"
            [disabled]="!contributorValue.canRevoke"
            (sqxConfirmClick)="remove()"
            type="button">
            <i class="icon-bin3"></i>
        </button>
    </td>
</tr>

<tr class="spacer"></tr>
