<div class="sidebar-section">
    <h3>{{ "search.sharedQueries" | sqxTranslate }}</h3>
    <sqx-query-list
        canRemove="true"
        [queries]="queries().queriesShared()"
        [queryUsed]="queryUsed()"
        (remove)="queries().removeShared($event)"
        (search)="search.emit($event)"
        [types]="types()" />
</div>

<hr />
