<sqx-modal-dialog (dialogClose)="emitClose()" flexBody="true" fullHeight="true" hasTabs="false" size="lg">
    <ng-container title> {{ "assets.selectMany" | sqxTranslate }}</ng-container>
    <ng-container tabs>
        <div class="row gx-2 mt-3 mb-3">
            <div class="col-auto">
                <button class="btn btn-text-secondary" attr.aria-label="{{ 'common.refresh' | sqxTranslate }}" (click)="reload()" type="button">
                    <i class="icon-reset"></i>
                </button>
            </div>

            <div class="col">
                <div class="row g-0 search">
                    <div class="col-6">
                        <sqx-tag-editor
                            class="tags"
                            [itemsSource]="assetsState.tagsNames()"
                            [ngModel]="assetsState.selectedTagNames()"
                            (ngModelChange)="selectTags($event)"
                            placeholder="{{ 'assets.searchByTags' | sqxTranslate }}"
                            styleScrollable="true"
                            undefinedWhenEmpty="false" />
                    </div>

                    <div class="col-6">
                        <sqx-search-form
                            enableShortcut="true"
                            formClass="form"
                            placeholder="{{ 'assets.searchByName' | sqxTranslate }}"
                            [queriesTypes]="'common.assets' | sqxTranslate"
                            [query]="assetsState.query()"
                            (queryChange)="search($event)" />
                    </div>
                </div>
            </div>

            <div class="col-auto">
                <div class="btn-group" data-toggle="buttons">
                    <button
                        class="btn btn-secondary btn-toggle"
                        attr.aria-label="{{ 'assets.listView' | sqxTranslate }}"
                        [class.btn-primary]="isListView()"
                        (click)="changeView(true)"
                        [disabled]="isListView()"
                        type="button">
                        <i class="icon-list"></i>
                    </button>
                    <button
                        class="btn btn-secondary btn-toggle"
                        attr.aria-label="{{ 'assets.gridView' | sqxTranslate }}"
                        [class.btn-primary]="!isListView()"
                        (click)="changeView(false)"
                        [disabled]="!isListView()"
                        type="button">
                        <i class="icon-grid"></i>
                    </button>
                </div>
            </div>
        </div>
    </ng-container>
    <ng-container content>
        <sqx-list-view [isLoading]="assetsState.isLoading()" overflow="true">
            <ng-container content>
                <sqx-assets-list
                    (assetSelect)="selectAsset($event)"
                    [assetsState]="assetsState"
                    [isDisabled]="true"
                    [isListView]="isListView()"
                    [selectedIds]="selectedAssets()" />
            </ng-container>
            <ng-container footer>
                <sqx-pager (loadTotal)="reloadTotal()" [paging]="assetsState.paging()" (pagingChange)="assetsState.page($event)" />
            </ng-container>
        </sqx-list-view>
    </ng-container>
    <ng-container footer>
        <button class="btn btn-text-secondary" (click)="emitClose()" type="button">{{ "common.cancel" | sqxTranslate }}</button>
        <button class="btn btn-success" (click)="emitSelect()" [disabled]="selectionCount() === 0" type="submit">
            {{ "assets.linkSelected" | sqxTranslate: { count: selectionCount() } }})
        </button>
    </ng-container>
</sqx-modal-dialog>
