@let node = nodeModel();
<div
    class="control-dropdown-item d-flex align-items-center"
    [class.active]="node.isSelected"
    (click)="selectNode.emit(node)"
    [style.paddingLeft]="paddingLeft()">
    @if (node.isLoading) {
        <ng-container class="loader">
            <button class="btn btn-sm btn-decent btn-text-secondary" type="button"><sqx-loader size="14" /></button>
        </ng-container>
    } @else {
        <button
            class="btn btn-sm btn-decent btn-text-secondary"
            [class.invisible]="node.isLoaded && node.children.length === 0"
            (click)="toggle()"
            sqxStopClick
            type="button">
            <i [class.icon-caret-down]="node.isExpanded && node.isLoaded" [class.icon-caret-right]="!node.isExpanded || !node.isLoaded"></i>
        </button>
    }

    <div class="name truncate">{{ node.item.folderName | sqxTranslate }}</div>
</div>

@if (node.isExpanded || node.isSelected) {
    <div class="tree-children">
        @for (child of node.children; track child.item.id) {
            <sqx-asset-folder-dropdown-item [appName]="appName()" [nodeLevel]="nodeLevel() + 1" [nodeModel]="child" (selectNode)="selectNode.emit($event)" />
        }
    </div>
}
