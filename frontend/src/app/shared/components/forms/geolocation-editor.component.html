<div class="editor-container" [class.compact]="isCompact()" (sqxResizeCondition)="setCompact($event)" sqxResizeMaxWidth="0" sqxResizeMinWidth="600">
    <form [class.hidden]="isMapHidden()">
        <div class="editor" #editor></div>
        <input
            class="form-control search-control"
            #searchBox
            [class.hidden]="!isGoogleMaps"
            [disabled]="disabled()"
            placeholder="{{ 'common.searchGoogleMaps' | sqxTranslate }}" />
    </form>

    <div class="row g-0 mt-2">
        <form class="col form-inline" (change)="updateValueByInput()" (ngSubmit)="updateValueByInput()">
            <div class="row g-2 align-items-center">
                <div class="col coordinate">
                    <sqx-control-errors [for]="geolocationForm.latitude" style="z-index: 10000" />
                    <input class="form-control" id="latitude" [formField]="geolocationForm.latitude" step="any" type="number" />

                    @if (!isCompact()) {
                        <label for="latitude">{{ "common.latitudeShort" | sqxTranslate }}</label>
                    }
                </div>

                <div class="col coordinate">
                    <sqx-control-errors [for]="geolocationForm.longitude" style="z-index: 10000" />
                    <input class="form-control" id="longitude" [formField]="geolocationForm.longitude" step="any" type="number" />

                    @if (!isCompact()) {
                        <label for="longitude">{{ "common.longitudeShort" | sqxTranslate }}</label>
                    }
                </div>

                @if (!isCompact()) {
                    <div class="col col-auto">
                        <button class="btn btn-text clear" (click)="clearValue()" [disabled]="disabled()" type="button">
                            {{ "common.clear" | sqxTranslate }}
                        </button>
                    </div>
                }
            </div>
        </form>

        <div class="col-auto d-flex gap-1">
            <button
                class="btn btn-text-secondary"
                attr.aria-label="{{ 'common.mapShow' | sqxTranslate }}"
                [class.hidden]="!isMapHidden()"
                (click)="hideMap(false)"
                title="i18n:common.mapShow"
                type="button">
                <i class="icon-plus2"></i>
            </button>
            <button
                class="btn btn-text-secondary"
                attr.aria-label="{{ 'common.mapHide' | sqxTranslate }}"
                [class.hidden]="isMapHidden()"
                (click)="hideMap(true)"
                title="i18n:common.mapHide"
                type="button">
                <i class="icon-minus2"></i>
            </button>
        </div>
    </div>
</div>
