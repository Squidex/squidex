<div class="card card-lg card-chart">
    <div class="card-header">
        {{ "dashboard.apiPerformanceCard" | sqxTranslate: { summary: chartSummary() } }}
        <div class="float-end">
            <div class="form-check">
                <input class="form-check-input" id="stacked" [checked]="isStacked()" (change)="isStackedChange.emit($any($event.target).checked)" type="checkbox" />
                <label class="form-check-label" for="stacked"> {{ "dashboard.stackedChart" | sqxTranslate }}</label>
            </div>
        </div>
    </div>

    <div class="card-body"><canvas baseChart [data]="chartData()" [options]="chartOptions()" type="bar"></canvas></div>
</div>
