@let user = focusedUser();
<div class="focus-container" (click)="onClick($event)" [style.borderColor]="user?.id | sqxStringColor">
    @if (user) {
        <div class="focused">
            <div class="focus-user" [style.background]="user.id | sqxStringColor">{{ user.displayName }}</div>
        </div>
    }
    <ng-content></ng-content>
</div>
